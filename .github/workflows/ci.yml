# Runs only when a release tag (v18.0.x.y.z, from `make release`) is pushed:
# build the module zip, run the test suite on exactly what is in it, and
# publish the zip as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        id: package
        run: |
          zip=$(dev/package)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "version=$(dev/version)" >> "$GITHUB_OUTPUT"

      - name: The tag matches the manifest
        run: |
          [ "$GITHUB_REF_NAME" = "v${{ steps.package.outputs.version }}" ] || {
            echo "::error::tag $GITHUB_REF_NAME but __manifest__.py says ${{ steps.package.outputs.version }}"; exit 1; }

      - name: Test the zip's contents
        run: |
          mkdir -p dist/unzipped
          unzip -q "${{ steps.package.outputs.zip }}" -d dist/unzipped
          FLEET_RENTAL_TEST_SRC="$PWD/dist/unzipped/fleet_rental" make test-check

      - uses: actions/upload-artifact@v4
        with:
          name: fleet_rental-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fleet_rental-${{ needs.build.outputs.version }}
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" fleet_rental-*.zip \
            --repo "$GITHUB_REPOSITORY" --title "fleet_rental $GITHUB_REF_NAME" --generate-notes
