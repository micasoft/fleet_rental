; Odoo config for the local dev stack. Database connection settings are
; passed by dev/entrypoint.sh from .env and the pg_password secret.
; limit_memory_* cap VIRTUAL memory per worker (Odoo defaults); real RAM is
; capped by mem_limit in docker-compose.yml.
[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
list_db = False
without_demo = all
workers = 1
max_cron_threads = 1
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 600
limit_time_real = 1200
log_level = info
